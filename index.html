<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>نظام المخزون</title>
</head>
<body style="font-family: Arial, sans-serif; padding: 20px; text-align: center;">

    <h1>نظام إدارة المخزون</h1>

    <input type="text" id="itemName" placeholder="اسم المنتج" style="padding: 10px; margin: 10px;">
    <input type="number" id="itemQty" placeholder="الكمية" style="padding: 10px; margin: 10px;">
    
    <button onclick="addItem()" style="padding: 10px 20px; background-color: green; color: white; border: none; border-radius: 5px; cursor: pointer;">إضافة منتج</button>

    <ul id="itemList" style="list-style-type: none; padding: 0; margin-top: 30px;"></ul>

    <script>
        function addItem() {
            var name = document.getElementById('itemName').value;
            var qty = document.getElementById('itemQty').value;
            
            if(name === '' || qty === '') {
                alert('الرجاء تعبئة جميع الحقول');
                return;
            }
            
            var li = document.createElement('li');
            li.textContent = name + ' - الكمية: ' + qty;
            
            document.getElementById('itemList').appendChild(li);
            
            document.getElementById('itemName').value = '';
            document.getElementById('itemQty').value = '';
        }
    </script>
</body>
</html>
