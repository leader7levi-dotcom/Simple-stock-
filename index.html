<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Nucleus Stockroom</title>
<style>
*{box-sizing:border-box;font-family:Arial,sans-serif}
body{margin:0;background:#f4f7f6;color:#333}
.hidden{display:none!important}
button,input,select{font:inherit}
#loginScreen{position:fixed;inset:0;background:#1e3a8a;display:flex;align-items:center;justify-content:center;z-index:9999}
.login-box,.card,.item{background:#fff;border-radius:12px;padding:16px;box-shadow:0 2px 8px #0001}
.login-box{width:92%;max-width:380px}.login-box h1{text-align:center;color:#1e3a8a}
input,select{width:100%;padding:11px;margin:5px 0;border:1px solid #ccc;border-radius:7px}
header{background:#1e3a8a;color:white;padding:16px;text-align:center;position:relative}
header h1{margin:0;font-size:20px}
.logout{position:absolute;right:10px;top:10px;background:#ef4444;color:white;border:0;border-radius:6px;padding:6px 10px}
nav{display:flex;background:white;position:sticky;top:0;z-index:100;overflow-x:auto;border-bottom:2px solid #ddd}
nav button{flex:1;min-width:75px;padding:12px 6px;border:0;background:none;font-weight:bold;color:#666}
nav button.active{color:#1e3a8a;border-bottom:3px solid #1e3a8a}
main{padding:15px;margin-bottom:70px}
.stats{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.stat{text-align:center;background:white;border-radius:10px;padding:15px;box-shadow:0 2px 5px #0001}
.stat p{font-size:24px;font-weight:bold;margin:5px}
.btn{border:0;border-radius:8px;padding:9px 12px;margin:3px;cursor:pointer}
.blue{background:#1e3a8a;color:white}.green{background:#10b981;color:white}
.red{background:#ef4444;color:white}.gray{background:#e5e7eb;color:#333}
.item{margin:10px 0}.item h3{color:#1e3a8a;margin:0 0 6px}
.batch{border-top:1px solid #eee;padding:9px 0;font-size:13px}
.badge{display:inline-block;border-radius:10px;padding:3px 7px;font-size:11px}
.ok{background:#dcfce7;color:#166534}.warn{background:#fef3c7;color:#92400e}.danger{background:#fee2e2;color:#b91c1c}
.modal{position:fixed;inset:0;background:#0008;display:flex;align-items:center;justify-content:center;z-index:500}
.modal-box{background:white;border-radius:12px;padding:20px;width:92%;max-width:420px}
.empty{text-align:center;color:#777;padding:20px}
.fab{position:fixed;right:20px;bottom:20px;width:58px;height:58px;border:0;border-radius:50%;background:#1e3a8a;color:white;font-size:28px}
</style>
</head>
<body>

<div id="loginScreen">
<div class="login-box">
<h1>تسجيل الدخول</h1>
<input id="user" placeholder="اسم المستخدم">
<input id="pass" type="password" placeholder="كلمة المرور">
<button class="btn blue" style="width:100%" onclick="login()">دخول</button>
<p style="font-size:12px;color:#888;text-align:center">Nucleus Stockroom</p>
</div>
</div>

<div id="app" class="hidden">
<header><h1>Nucleus Stockroom</h1><button class="logout" onclick="logout()">خروج</button></header>
<nav>
<button class="active" onclick="showPage('dashboard',this)">الرئيسية</button>
<button onclick="showPage('items',this)">الأصناف</button>
<button onclick="showPage('add',this)">إضافة</button>
<button onclick="showPage('withdraw',this)">صرف</button>
<button onclick="showPage('history',this)">السجل</button>
</nav>

<main>
<section id="dashboard">
<div class="stats">
<div class="stat">عدد الأصناف<p id="countItems">0</p></div>
<div class="stat">إجمالي الكمية<p id="totalQty">0</p></div>
<div class="stat">قرب الانتهاء ≤30 يوم<p id="warning">0</p></div>
<div class="stat">منتهي الصلاحية<p id="expired">0</p></div>
</div>

<div class="card" style="margin-top:15px">
<h3>آخر الحركات</h3>
<div id="recent"></div>
</div>
</section>

<section id="items" class="hidden">
<div class="card">
<h3>إضافة صنف جديد</h3>
<input id="newName" placeholder="اسم الصنف">
<input id="newCat" placeholder="التصنيف">
<input id="newMin" type="number" min="0" placeholder="الحد الأدنى">
<button class="btn green" onclick="addItem()">إضافة</button>
</div>

<div class="card">
<input id="search" placeholder="بحث عن صنف..." oninput="renderItems()">
</div>

<div id="itemsList"></div>
</section>

<section id="add" class="hidden">
<div class="card">
<h3>إضافة كمية / دفعة</h3>
<select id="addItem"></select>
<input id="addBatch" placeholder="رقم الدفعة">
<input id="addExp" type="date">
<input id="addQty" type="number" min="1" placeholder="الكمية">
<input id="addSupplier" placeholder="المورد">
<button class="btn green" onclick="addStock()">إضافة</button>
</div>
</section>

<section id="withdraw" class="hidden">
<div class="card">
<h3>صرف كمية — FEFO</h3>
<select id="withdrawItem" onchange="renderAvailable()"></select>
<div id="available"></div>
<input id="withdrawQty" type="number" min="1" placeholder="الكمية المطلوبة">
<button class="btn blue" onclick="withdrawStock()">صرف</button>
</div>
</section>

<section id="history" class="hidden">
<div class="card">
<h3>سجل الحركات</h3>
<input id="historySearch" placeholder="بحث..." oninput="renderHistory()">
<div id="historyList"></div>
</div>
</section>
</main>

<button class="fab" onclick="showPage('add',document.querySelectorAll('nav button')[2])">+</button>
</div>

<div id="itemModal" class="modal hidden" onclick="closeItemModal()">
<div class="modal-box" onclick="event.stopPropagation()">
<h3>تعديل الصنف</h3>
<input id="editName" placeholder="اسم الصنف">
<input id="editCat" placeholder="التصنيف">
<input id="editMin" type="number" min="0" placeholder="الحد الأدنى">

<button class="btn green" style="width:100%" onclick="saveItem()">حفظ</button>
<button class="btn red" style="width:100%" onclick="archiveItem()">أرشفة</button>
<button class="btn gray" style="width:100%" onclick="closeItemModal()">إلغاء</button>
</div>
</div>

<div id="batchModal" class="modal hidden" onclick="closeBatchModal()">
<div class="modal-box" onclick="event.stopPropagation()">
<h3>تعديل الدفعة</h3>
<input id="editQty" type="number" min="0" placeholder="الكمية">
<input id="editExp" type="date">
<input id="editSupplier" placeholder="المورد">

<button class="btn green" style="width:100%" onclick="saveBatch()">حفظ</button>
<button class="btn red" style="width:100%" onclick="deleteBatch()">حذف الدفعة</button>
<button class="btn gray" style="width:100%" onclick="closeBatchModal()">إلغاء</button>
</div>
</div>

<script>
const KEY='nucleus_stockroom_v3';

let data={
items:[],
batches:[],
history:[],
user:null
};

let editItemId=null;
let editBatchId=null;

function load(){
try{
const x=localStorage.getItem(KEY);
if(x)data=JSON.parse(x);
}catch(e){}
}

function save(){
localStorage.setItem(KEY,JSON.stringify(data));
}

function esc(x){
return String(x??'').replace(/[&<>"']/g,c=>({
'&':'&amp;',
'<':'&lt;',
'>':'&gt;',
'"':'&quot;',
"'":'&#39;'
}[c]));
}

function login(){
const u=document.getElementById('user').value.trim();
const p=document.getElementById('pass').value;

if(u==='FAPIPSMADOTA'&&p==='1997511KEV'){
data.user=u;
save();

document.getElementById('loginScreen').classList.add('hidden');
document.getElementById('app').classList.remove('hidden');

refresh();
}else{
alert('بيانات الدخول غير صحيحة');
}
}

function logout(){
data.user=null;
save();
location.reload();
}

function showPage(id,btn){
document.querySelectorAll('main>section').forEach(x=>x.classList.add('hidden'));

document.getElementById(id).classList.remove('hidden');

document.querySelectorAll('nav button').forEach(x=>x.classList.remove('active'));

if(btn)btn.classList.add('active');

refresh();
}

function days(exp){
return Math.ceil(
(
new Date(exp).setHours(0,0,0,0)-
new Date().setHours(0,0,0,0)
)/86400000
);
}

function badge(exp,qty){
const d=days(exp);

if(qty<=0)
return '<span class="badge danger">نفد</span>';

if(d<0)
return '<span class="badge danger">منتهي</span>';

if(d<=30)
return '<span class="badge warn">قريب الانتهاء</span>';

return '<span class="badge ok">جيد</span>';
}

function refresh(){

const active=data.items.filter(i=>i.active!==false);

let total=0;
let w=0;
let e=0;

data.batches.forEach(b=>{
total+=Number(b.qty)||0;

const d=days(b.exp);

if(d<0)e++;
else if(d<=30)w++;
});

countItems.textContent=active.length;
totalQty.textContent=total;
warning.textContent=w;
expired.textContent=e;

renderRecent();
renderItems();
renderSelects();
renderHistory();
}

function renderRecent(){

const a=data.history.slice(-5).reverse();

recent.innerHTML=a.length
?a.map(h=>`
<div style="padding:7px;border-bottom:1px solid #eee">
${esc(h.user)} — ${esc(h.type)} — ${esc(h.item)} — ${h.qty}
${h.batch?' — '+esc(h.batch):''}
</div>
`).join('')
:'<div class="empty">لا توجد حركات</div>';
}

function renderItems(){

const q=(document.getElementById('search')?.value||'').toLowerCase();

const a=data.items.filter(i=>
i.active!==false &&
i.name.toLowerCase().includes(q)
);

itemsList.innerHTML=a.length
?a.map(i=>{

const bs=data.batches.filter(b=>b.itemId===i.id);

const total=bs.reduce(
(s,b)=>s+Number(b.qty),0
);

return `
<div class="item">

<h3>
${esc(i.name)}
${total<i.min?'<span class="badge danger">نقص</span>':''}
</h3>

<small>
${esc(i.cat||'')} |
المخزون: ${total} |
الحد الأدنى: ${i.min}
</small>

${
bs.length
?bs.map(b=>`
<div class="batch">

<b>${esc(b.batch)}</b> |
كمية: ${b.qty} |
انتهاء: ${esc(b.exp)}
${badge(b.exp,b.qty)}

<button class="btn gray"
onclick="openBatch(${b.id})">
تعديل
</button>

</div>
`).join('')
:'<div class="empty">لا توجد دفعات</div>'
}

<button class="btn blue"
onclick="openItem(${i.id})">
تعديل الصنف
</button>

</div>
`;

}).join('')
:'<div class="card empty">لا توجد أصناف</div>';
}

function renderSelects(){

const a=data.items.filter(i=>i.active!==false);

const o=a.map(i=>
`<option value="${i.id}">${esc(i.name)}</option>`
).join('');

addItem.innerHTML=o||'<option value="">لا توجد أصناف</option>';

withdrawItem.innerHTML=o||'<option value="">لا توجد أصناف</option>';

renderAvailable();
}

function addItem(){

const name=newName.value.trim();

if(!name)
return alert('أدخل اسم الصنف');

const i={
id:Date.now(),
name,
cat:newCat.value.trim(),
min:Number(newMin.value)||0,
active:true
};

data.items.push(i);

historyAdd(
'ADD_ITEM',
i.name,
0
);

save();
refresh();

newName.value='';
newCat.value='';
newMin.value='';

alert('تمت إضافة الصنف');
}

function addStock(){

const itemId=Number(addItem.value);
const batch=addBatch.value.trim();
const exp=addExp.value;
const qty=Number(addQty.value);
const supplier=addSupplier.value.trim();

if(!itemId||!batch||!exp||qty<=0)
return alert('أكمل البيانات بشكل صحيح');

let b=data.batches.find(
x=>x.itemId===itemId&&x.batch===batch
);

if(b){

b.qty+=qty;
b.exp=exp;

if(supplier)
b.supplier=supplier;

}else{

data.batches.push({
id:Date.now(),
itemId,
batch,
qty,
exp,
supplier
});

}

const i=data.items.find(x=>x.id===itemId);

historyAdd(
'ADD',
i.name,
qty,
batch
);

save();
refresh();

addBatch.value='';
addExp.value='';
addQty.value='';
addSupplier.value='';

alert('تمت الإضافة');
}

function renderAvailable(){

const id=Number(withdrawItem.value);

const bs=data.batches
.filter(b=>b.itemId===id&&b.qty>0)
.sort(
(a,b)=>new Date(a.exp)-new Date(b.exp)
);

available.innerHTML=bs.length
?'<b>الدفعات حسب FEFO:</b>'+
bs.map(b=>`
<div style="padding:6px;border-bottom:1px solid #eee">
${esc(b.batch)} |
${b.qty} |
${esc(b.exp)}
${badge(b.exp,b.qty)}
</div>
`).join('')
:'<div class="empty">لا توجد كمية متاحة</div>';
}

function withdrawStock(){

const id=Number(withdrawItem.value);
const qty=Number(withdrawQty.value);

if(!id||qty<=0)
return alert('أدخل كمية صحيحة');

const bs=data.batches
.filter(b=>b.itemId===id&&b.qty>0)
.sort(
(a,b)=>new Date(a.exp)-new Date(b.exp)
);

const availableQty=bs.reduce(
(s,b)=>s+Number(b.qty),0
);

// الإصلاح المهم:
// نتحقق من الكمية قبل أي خصم.
if(qty>availableQty)
return alert(
'الكمية المطلوبة أكبر من المتوفر. المتوفر: '+
availableQty
);

let rem=qty;

const i=data.items.find(x=>x.id===id);

const moves=[];

for(const b of bs){

if(!rem)break;

const take=Math.min(rem,b.qty);

b.qty-=take;
rem-=take;

moves.push([
b.batch,
take
]);
}

moves.forEach(x=>
historyAdd(
'WITHDRAW',
i.name,
x[1],
x[0]
)
);

save();
refresh();

withdrawQty.value='';

alert('تم الصرف بنجاح حسب FEFO');
}

function historyAdd(
type,
item,
qty,
batch=''
){

data.history.push({
id:Date.now()+Math.random(),
date:new Date().toISOString(),
type,
item,
qty,
batch,
user:data.user||'system'
});
}

function renderHistory(){

const q=(historySearch?.value||'').toLowerCase();

const a=data.history
.slice()
.reverse()
.filter(h=>
(
h.type+' '+
h.item+' '+
h.batch+' '+
h.user
).toLowerCase().includes(q)
);

historyList.innerHTML=a.length
?a.map(h=>`
<div style="padding:9px;border-bottom:1px solid #eee">

<b>${esc(h.type)}</b> —
${esc(h.item)} —
${h.qty}

${h.batch?
' — دفعة: '+esc(h.batch)
:''}

<br>

<small>
${new Date(h.date).toLocaleString('ar-IQ')}
—
${esc(h.user)}
</small>

</div>
`).join('')
:'<div class="empty">لا توجد حركات</div>';
}

function openItem(id){

editItemId=id;

const i=data.items.find(x=>x.id===id);

if(!i)return;

editName.value=i.name;
editCat.value=i.cat||'';
editMin.value=i.min||0;

itemModal.classList.remove('hidden');
}

function saveItem(){

const i=data.items.find(
x=>x.id===editItemId
);

const name=editName.value.trim();

if(!i||!name)
return alert('أدخل اسم الصنف');

i.name=name;
i.cat=editCat.value.trim();
i.min=Number(editMin.value)||0;

save();

closeItemModal();
refresh();

alert('تم التعديل');
}

function archiveItem(){

const i=data.items.find(
x=>x.id===editItemId
);

if(!i)return;

if(!confirm(
'أرشفة الصنف؟ سيبقى السجل محفوظًا.'
))
return;

i.active=false;

save();
closeItemModal();
refresh();

alert('تمت الأرشفة');
}

function closeItemModal(){
itemModal.classList.add('hidden');
}

function openBatch(id){

editBatchId=id;

const b=data.batches.find(
x=>x.id===id
);

if(!b)return;

editQty.value=b.qty;
editExp.value=b.exp;
editSupplier.value=b.supplier||'';

batchModal.classList.remove('hidden');
}

function saveBatch(){

const b=data.batches.find(
x=>x.id===editBatchId
);

const q=Number(editQty.value);

if(!b||q<0||!editExp.value)
return alert('أدخل البيانات بشكل صحيح');

b.qty=q;
b.exp=editExp.value;
b.supplier=editSupplier.value.trim();

save();

closeBatchModal();
refresh();

alert('تم تعديل الدفعة');
}

function deleteBatch(){

if(!confirm(
'هل أنت متأكد من حذف الدفعة؟'
))
return;

data.batches=data.batches.filter(
x=>x.id!==editBatchId
);

save();

closeBatchModal();
refresh();

alert('تم حذف الدفعة');
}

function closeBatchModal(){
batchModal.classList.add('hidden');
}

load();

if(data.user){

loginScreen.classList.add('hidden');
app.classList.remove('hidden');

}

refresh();
</script>

</body>
</html>
